# The brain's own retrieval text (BRAIN-1.5). Brain-only: no LLM ever reads it.
#
# How a person talks to an assistant, per tool — not how a tool is documented.
# Neutral Spanish (tú and usted both count) and English; nothing regional.
# {placeholders} are the tool's parameter names; one phrasing covers every value.
# `stt` holds mangled forms speech recognition produces or is expected to.
#
# NEVER copy a labelled utterance (scripts/spike_cascade/data/labelled.json) here:
# those 140 are the exam. tests/test_phrasebook.py enforces it, and that no
# phrasing appears under two tools.

