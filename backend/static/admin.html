<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operación · Emma</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/atom.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/components.css">
<script src="/static/nav.js" defer></script>
<style>
  .table td.num{text-align:right;color:var(--ink);font-family:var(--font-mono)}
  .inline{display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:flex-end}
  .inline .field{flex:1;min-width:200px;margin-bottom:0}
</style>
</head><body class="page">
<header data-nav></header>
<main id="main" class="reading">
  <h1>Operación</h1>
  <p class="notice notice-error" id="err" role="alert" hidden>No autorizado.</p>

  <section class="card" aria-labelledby="h_over">
    <h2 id="h_over">Resumen</h2>
    <div class="table-wrap"><table class="table">
      <tbody>
        <tr><th scope="row">Gasto OpenAI hoy</th><td class="num" id="today">–</td></tr>
        <tr><th scope="row">Gasto OpenAI este mes</th><td class="num" id="month">–</td></tr>
        <tr><th scope="row">Sesiones (24h)</th><td class="num" id="sessions">–</td></tr>
        <tr><th scope="row">Presupuesto mensual</th><td class="num" id="budget">–</td></tr>
      </tbody>
    </table></div>
    <p class="fine">Ingresos y margen llegan en un seguimiento (requiere datos de Stripe).</p>
  </section>

  <section class="card" aria-labelledby="h_kill">
    <h2 id="h_kill">Kill switch</h2>
    <form id="killForm" class="stack" onsubmit="return killUser(event)">
      <div class="inline">
        <div class="field"><label for="killEmail">Correo</label>
          <input class="input" id="killEmail" type="email" placeholder="usuario@email.com" required></div>
        <div class="field"><label for="killReason">Razón</label>
          <input class="input" id="killReason" placeholder="Queda en el audit trail"></div>
        <button class="btn btn-danger" type="submit">Desactivar</button>
      </div>
    </form>
    <p class="fine" id="killMsg" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="h_revive">
    <h2 id="h_revive">Reactivar</h2>
    <form id="reviveForm" onsubmit="return reviveUser(event)">
      <div class="inline">
        <div class="field"><label for="reviveEmail">Correo</label>
          <input class="input" id="reviveEmail" type="email" placeholder="usuario@email.com" required></div>
        <button class="btn btn-secondary" type="submit">Reactivar</button>
      </div>
    </form>
    <p class="fine" id="reviveMsg" role="status" aria-live="polite"></p>
  </section>
</main>
<footer data-footer></footer>
<svg class="atom idle-atom" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g transform="translate(50 50)"><g class="ia-spin"><ellipse class="ring" rx="42" ry="14"/><ellipse class="ring" rx="42" ry="14" transform="rotate(60)"/><ellipse class="ring" rx="42" ry="14" transform="rotate(-60)"/><circle class="electron ia-e ia-e1" r="4"/><g transform="rotate(60)"><circle class="electron ia-e ia-e2" r="4"/></g><g transform="rotate(-60)"><circle class="electron ia-e ia-e3" r="4"/></g></g><circle class="core" r="8"/></g></svg>
<script>
async function load(){
  const r=await fetch("/api/admin/overview");
  if(!r.ok){ document.getElementById("err").hidden=false; return; }
  const d=await r.json();
  document.getElementById("today").textContent="$"+(d.spend_today_usd||0).toFixed(2);
  document.getElementById("month").textContent="$"+(d.spend_month_usd||0).toFixed(2);
  document.getElementById("sessions").textContent=d.sessions_today||0;
  document.getElementById("budget").textContent="$"+(d.monthly_budget_usd||0);
}
load();

async function killUser(ev){
  ev.preventDefault();
  const email=document.getElementById("killEmail").value.trim();
  const reason=document.getElementById("killReason").value.trim();
  if(!confirm(`¿Desactivar ${email}? Corta sesiones activas y revoca sus tokens.`)) return false;
  const r=await fetch("/api/admin/disable-user",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({email,reason})});
  const d=await r.json().catch(()=>({}));
  document.getElementById("killMsg").textContent=
    r.ok?`Listo. Cortadas ${d.sessions_cut} sesiones, tokens revocados.`:`Error: ${d.detail||r.status}`;
  return false;
}
async function reviveUser(ev){
  ev.preventDefault();
  const email=document.getElementById("reviveEmail").value.trim();
  const r=await fetch("/api/admin/enable-user",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
  const d=await r.json().catch(()=>({}));
  document.getElementById("reviveMsg").textContent=r.ok?"Reactivado.":`Error: ${d.detail||r.status}`;
  return false;
}
</script>
</body></html>
