<!doctype html>
<html lang="{{lang}}">
<head>
{{head}}
<style>
/* idle atom in the corner: same snippet on every page (candidate for components.css) */
</style>
</head>
<body class="page">
<header data-nav></header>
<main id="main" class="narrow">
  <h1>{{t.h1}}</h1>
  <form id="form" class="card" novalidate>
    <div class="notice notice-error" id="err" role="alert" aria-live="assertive"></div>
    <div class="field">
      <label for="email">{{t.email}}</label>
      <input class="input" id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">{{t.password}}</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="help"><a href="{{path.forgot}}">{{t.forgot}}</a></p>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="submit">{{t.submit}}</button>
  </form>
  <div class="oauth stack">{{oauth}}</div>
  <p class="switch">{{t.no_account}} <a href="{{path.signup}}">{{t.signup}}</a></p>
</main>
<footer data-footer></footer>
<svg class="atom idle-atom" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g transform="translate(50 50)"><g class="ia-spin"><ellipse class="ring" rx="42" ry="14"/><ellipse class="ring" rx="42" ry="14" transform="rotate(60)"/><ellipse class="ring" rx="42" ry="14" transform="rotate(-60)"/><circle class="electron ia-e ia-e1" r="4"/><g transform="rotate(60)"><circle class="electron ia-e ia-e2" r="4"/></g><g transform="rotate(-60)"><circle class="electron ia-e ia-e3" r="4"/></g></g><circle class="core" r="8"/></g></svg>
<script>
const T = {{i18n}};
const form = document.getElementById('form'), err = document.getElementById('err'), btn = document.getElementById('submit');
const fields = [form.email, form.password];
// Only same-site paths: never bounce a fresh session to another origin.
const next = new URLSearchParams(location.search).get('next');
const dest = next && /^\/(?!\/)/.test(next) ? next : '{{path.account}}';
function fail(msg, field) {
  err.textContent = msg;
  fields.forEach(f => f.setAttribute('aria-invalid', String(f === field || (field === true && !f.value))));
  btn.removeAttribute('aria-busy');
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  if (!form.email.value.trim() || !form.password.value) return fail(T.err_required, true);
  btn.setAttribute('aria-busy', 'true');
  try {
    const r = await fetch('/api/auth/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin', body: JSON.stringify({email: form.email.value.trim(), password: form.password.value})});
    if (r.ok) { location.assign(dest); return; }
    fail(r.status === 429 ? T.err_429 : T.err_401, r.status === 429 ? null : form.password);
  } catch (_) { fail(T.err_network, null); }
});
</script>
</body>
</html>
